server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the static chat UI, and reverse-proxy the agent so the browser makes
    # same-origin calls (no CORS). ${AGENT_UPSTREAM} is substituted at container
    # start by the official nginx image's envsubst templates step.
    location = /chat {
        proxy_pass http://${AGENT_UPSTREAM}/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
