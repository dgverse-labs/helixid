server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the static chat UI, and reverse-proxy the agent's public API so the
    # browser makes same-origin calls (no CORS). ${AGENT_UPSTREAM} is substituted
    # at container start by the official nginx image's envsubst templates step.
    # Public endpoints the UI uses. /onboard-agent accepts a one-time token the
    # user generated in Console; it never returns wallet/VC/VP material.
    location = /personas {
        proxy_pass http://${AGENT_UPSTREAM}/personas;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location = /chat {
        proxy_pass http://${AGENT_UPSTREAM}/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location = /onboard-agent {
        proxy_pass http://${AGENT_UPSTREAM}/onboard-agent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location = /revoke-agent {
        proxy_pass http://${AGENT_UPSTREAM}/revoke-agent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location = /delegation-demo-agents {
        proxy_pass http://${AGENT_UPSTREAM}/delegation-demo-agents;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location = /delegate-agent {
        proxy_pass http://${AGENT_UPSTREAM}/delegate-agent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
