server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the runtime-generated config.
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: /agents, /enroll, /services are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
