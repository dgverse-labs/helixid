openapi: "3.1.0"
info:
  title: Helix ID
  version: "0.1.0"
  description: Helix ID agent identity and trust infrastructure API.
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: API health
  /v1/dids:
    post:
      summary: Create a DID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDIDRequest"
      responses:
        "201":
          description: DID created
  /v1/dids/{did}:
    get:
      summary: Resolve a DID
      parameters:
        - in: path
          name: did
          required: true
          schema:
            type: string
        - in: query
          name: live
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: DID resolved
  /v1/dids/{did}/services:
    post:
      summary: Add a DID service endpoint
      parameters:
        - in: path
          name: did
          required: true
          schema:
            type: string
      responses:
        "200":
          description: DID updated
  /v1/dids/{did}/services/{endpointId}:
    delete:
      summary: Remove a DID service endpoint
      parameters:
        - in: path
          name: did
          required: true
          schema:
            type: string
        - in: path
          name: endpointId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: DID updated
  /v1/dids/{did}/deactivate:
    post:
      summary: Deactivate a DID
      parameters:
        - in: path
          name: did
          required: true
          schema:
            type: string
      responses:
        "204":
          description: DID deactivated
  /v1/vcs:
    post:
      summary: Issue a VC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueVCRequest"
      responses:
        "201":
          description: VC issued
  /v1/vcs/{vcId}:
    get:
      summary: Get VC details
      parameters:
        - in: path
          name: vcId
          required: true
          schema:
            type: string
            pattern: "^vc:helix:[a-zA-Z0-9]+$"
      responses:
        "200":
          description: VC details
  /v1/vcs/{vcId}/revoke:
    post:
      summary: Revoke a VC
      description: Admin-only issuer operation. Requires x-admin-api-key.
      parameters:
        - in: path
          name: vcId
          required: true
          schema:
            type: string
        - in: header
          name: x-admin-api-key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: VC revoked
        "403":
          description: Admin authorization required
  /v1/vcs/{vcId}/renew:
    post:
      summary: Renew a VC
      parameters:
        - in: path
          name: vcId
          required: true
          schema:
            type: string
      responses:
        "201":
          description: VC renewed
  /v1/status-list/{listId}:
    get:
      summary: Get StatusList2021 credential
      parameters:
        - in: path
          name: listId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Status list credential
  /v1/vp/template:
    post:
      summary: Generate unsigned VP template
      responses:
        "201":
          description: VP template generated
  /v1/vp/verify:
    post:
      summary: Verify signed VP
      responses:
        "200":
          description: VP verified
  /v1/enrollment-tokens:
    post:
      summary: Generate enrollment token
      responses:
        "201":
          description: Enrollment token generated
  /v1/onboard:
    post:
      summary: Agent onboarding step 1
      responses:
        "200":
          description: Challenge issued
  /v1/onboard/verify:
    post:
      summary: Agent onboarding step 2
      responses:
        "201":
          description: Agent onboarded
  /v1/challenges:
    post:
      summary: Issue user verification challenge
      responses:
        "201":
          description: Challenge issued
  /v1/challenges/{challengeId}/verify:
    post:
      summary: Verify user challenge
      responses:
        "200":
          description: Challenge verified
  /v1/services:
    get:
      summary: List services
      responses:
        "200":
          description: Active services
    post:
      summary: Register a service
      responses:
        "201":
          description: Service created
  /v1/services/{serviceName}:
    get:
      summary: Get service by name
      responses:
        "200":
          description: Service found
components:
  schemas:
    CreateDIDRequest:
      type: object
      required: [publicKeyHex, subjectType]
      properties:
        publicKeyHex:
          type: string
        subjectType:
          type: string
          enum: [agent, user]
        domains:
          type: array
          items:
            type: string
    IssueVCRequest:
      type: object
      required: [subjectDid, subjectType, expiresInSeconds]
      properties:
        subjectDid:
          type: string
        subjectType:
          type: string
          enum: [agent, user]
        privilegeScopes:
          type: array
          items:
            type: string
        agentName:
          type: string
        userId:
          type: string
        expiresInSeconds:
          type: integer
          minimum: 3600
          maximum: 31536000
