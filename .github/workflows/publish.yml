name: Publish npm package

on:
  push:
    tags:
      - "core-v*"
      - "sdk-js-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Enable Corepack
        run: corepack enable

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve package from tag
        id: release
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          case "$TAG" in
            core-v*)
              PACKAGE_DIR="helix-core"
              PACKAGE_NAME="@helixid/core"
              TAG_VERSION="${TAG#core-v}"
              ;;

            sdk-js-v*)
              PACKAGE_DIR="helix-sdk-js"
              PACKAGE_NAME="@helixid/sdk-js"
              TAG_VERSION="${TAG#sdk-js-v}"
              ;;

            *)
              echo "Unsupported release tag: $TAG"
              exit 1
              ;;
          esac

          PACKAGE_VERSION=$(node -p \
            "require('./${PACKAGE_DIR}/package.json').version")

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release tag version: $TAG_VERSION"
            echo "package.json version: $PACKAGE_VERSION"
            echo "The tag and package version must match."
            exit 1
          fi

          echo "directory=$PACKAGE_DIR" >> "$GITHUB_OUTPUT"
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether version already exists
        id: npm-check
        shell: bash
        run: |
          PACKAGE="${{ steps.release.outputs.name }}"
          VERSION="${{ steps.release.outputs.version }}"

          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE@$VERSION already exists on npm."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "$PACKAGE@$VERSION is ready to publish."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.npm-check.outputs.exists == 'false'
        run: pnpm --filter "./${{ steps.release.outputs.directory }}" test

      - name: Build package and dependencies
        if: steps.npm-check.outputs.exists == 'false'
        run: |
          pnpm \
            --filter "./${{ steps.release.outputs.directory }}..." \
            build

      - name: Inspect package
        if: steps.npm-check.outputs.exists == 'false'
        working-directory: ${{ steps.release.outputs.directory }}
        run: npm pack --dry-run

      - name: Publish package
        if: steps.npm-check.outputs.exists == 'false'
        working-directory: ${{ steps.release.outputs.directory }}
        run: npm publish --access public --no-git-checks
