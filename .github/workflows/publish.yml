name: Publish npm package

on:
  push:
    tags:
      - "core-v*"
      - "sdk-js-v*"
      - "mcp-v*"
      - "langchain-v*"
      - "did-hedera-v*"
      - "cli-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # setup-node's pnpm cache integration calls `pnpm store path`, so pnpm
      # must already be available on PATH before setup-node runs.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve package from tag
        id: release
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          case "$TAG" in
            core-v*)
              PACKAGE_DIR="helix-core"
              PACKAGE_NAME="@helixid/core"
              TAG_VERSION="${TAG#core-v}"
              ;;

            sdk-js-v*)
              PACKAGE_DIR="helix-sdk-js"
              PACKAGE_NAME="@helixid/sdk-js"
              TAG_VERSION="${TAG#sdk-js-v}"
              ;;

            mcp-v*)
              PACKAGE_DIR="packages/mcp"
              PACKAGE_NAME="@helixid/mcp"
              TAG_VERSION="${TAG#mcp-v}"
              ;;

            langchain-v*)
              PACKAGE_DIR="packages/langchain"
              PACKAGE_NAME="@helixid/langchain"
              TAG_VERSION="${TAG#langchain-v}"
              ;;

            did-hedera-v*)
              PACKAGE_DIR="packages/did-hedera"
              PACKAGE_NAME="@helixid/did-hedera"
              TAG_VERSION="${TAG#did-hedera-v}"
              ;;

            cli-v*)
              PACKAGE_DIR="packages/cli"
              PACKAGE_NAME="@helixid/cli"
              TAG_VERSION="${TAG#cli-v}"
              ;;

            *)
              echo "Unsupported release tag: $TAG"
              exit 1
              ;;
          esac

          PACKAGE_VERSION=$(node -p \
            "require('./${PACKAGE_DIR}/package.json').version")

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release tag version: $TAG_VERSION"
            echo "package.json version: $PACKAGE_VERSION"
            echo "The tag and package version must match."
            exit 1
          fi

          echo "directory=$PACKAGE_DIR" >> "$GITHUB_OUTPUT"
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether version already exists
        id: npm-check
        shell: bash
        run: |
          PACKAGE="${{ steps.release.outputs.name }}"
          VERSION="${{ steps.release.outputs.version }}"

          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE@$VERSION already exists on npm."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "$PACKAGE@$VERSION is ready to publish."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # - name: Run tests
      #   if: steps.npm-check.outputs.exists == 'false'
      #   run: pnpm --filter "./${{ steps.release.outputs.directory }}" test

      - name: Build package and dependencies
        if: steps.npm-check.outputs.exists == 'false'
        run: |
          pnpm \
            --filter "${{ steps.release.outputs.name }}..." \
            build

      - name: Pack package
        id: pack
        if: steps.npm-check.outputs.exists == 'false'
        working-directory: ${{ steps.release.outputs.directory }}
        shell: bash
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"

          PACKAGE_FILE="${{ steps.release.outputs.name }}"
          PACKAGE_FILE="${PACKAGE_FILE#@}"
          PACKAGE_FILE="${PACKAGE_FILE/\//-}-${{ steps.release.outputs.version }}.tgz"
          TARBALL="$RUNNER_TEMP/$PACKAGE_FILE"

          test -f "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Publish package
        if: steps.npm-check.outputs.exists == 'false'
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public
