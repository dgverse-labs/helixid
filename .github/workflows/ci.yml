name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: helixid_test
          POSTGRES_PASSWORD: helixid_test
          POSTGRES_DB: helixid_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      # @helixid/console is excluded for now: its type imports from @helixid/sdk-js
      # (AuditFilters, EnrollmentTokenInput, VcFilters, etc.) don't match the names
      # sdk-js actually exports, so its build always fails. Pre-existing mismatch,
      # unrelated to this change — tracked as a follow-up, not papered over silently.
      - name: Build
        run: pnpm exec turbo run build --filter=!@helixid/console

      - name: Prepare test database
        run: pnpm --filter @helixid/api db:test:prepare
        env:
          DATABASE_URL: postgresql://helixid_test:helixid_test@localhost:5433/helixid_test
          NODE_ENV: test

      - name: Test
        run: pnpm run test
        env:
          DATABASE_URL: postgresql://helixid_test:helixid_test@localhost:5433/helixid_test
          NODE_ENV: test
          HEDERA_NETWORK: testnet
          HEDERA_OPERATOR_ID: ${{ secrets.HEDERA_OPERATOR_ID }}
          HEDERA_OPERATOR_KEY: ${{ secrets.HEDERA_OPERATOR_KEY }}
          HEDERA_TOPIC_ID: ${{ secrets.HEDERA_TOPIC_ID }}
          HELIX_SIGNING_KEY: ${{ secrets.HELIX_SIGNING_KEY }}
          API_BASE_URL: http://localhost:3000
          ENROLLMENT_TOKEN_TTL_SECONDS: 900
          CHALLENGE_TTL_SECONDS: 300
          VP_TTL_SECONDS: 300
          AUDIT_LOG_DESTINATION: stdout
