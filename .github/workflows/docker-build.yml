name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: helixid/helixid

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Run docker/setup-buildx-action@v3
        uses: docker/setup-buildx-action@v3

      # Only log in / push on main — PR builds (github.ref is the PR's
      # merge ref there, never refs/heads/main) stay build-only.
      - name: Run docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # @helixid/sdk-js and @helixid/did-hedera are pnpm git dependencies
      # pointing at the currently-private helix-sdk-js repo (see the
      # Dockerfile header). The build needs read access to it regardless
      # of whether this run also pushes, so this secret is passed on
      # every build, PR included — same HELIXID_CROSS_REPO_TOKEN used by
      # ci.yml, mounted under the id the Dockerfile already expects.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          secrets: |
            cross_repo_token=${{ secrets.HELIXID_CROSS_REPO_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
